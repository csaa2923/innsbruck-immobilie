name: Install local fonts
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/local-fonts.yml'
permissions:
  contents: write
jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download open-source fonts
        run: |
          sh scripts/download-fonts.sh
      - name: Commit local font assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fonts/
          if ! git diff --cached --quiet; then
            git commit -m "Add locally hosted font binaries"
            git push
          fi
